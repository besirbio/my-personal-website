<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seed Germination – From Bean to Seedling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2B2D42;--bg:#FAF8F3;--green:#2A9D8F;--leaf:#52B788;--gold:#FFB703;--water:#8ECAE6;--soil:#8A5A36;--plum:#5A3E72}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
#app{max-width:1440px;margin:0 auto;padding:12px}
header{display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,#2D6A4F,#40916C);color:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 18px;margin-bottom:12px}
header .logo{width:46px;height:46px;flex:none}
header h1{margin:0;font-size:clamp(18px,2.4vw,28px);font-weight:900;letter-spacing:.3px}
header .sub{font-size:14px;opacity:.9;font-weight:600}
header .grade{margin-left:auto;background:#fff;color:#2D6A4F;border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.main{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(310px,1fr);gap:12px;align-items:start}
@media(max-width:920px){.main{grid-template-columns:1fr}}
.stage{position:relative;background:#fff;border:3px solid var(--ink);border-radius:18px;overflow:hidden}
canvas{display:block;width:100%;aspect-ratio:5/3;cursor:default}
.panel{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:16px 18px;min-height:200px}
.tagline{display:inline-block;background:var(--plum);color:#fff;font-weight:800;font-size:13px;border-radius:999px;padding:3px 11px;letter-spacing:.5px;text-transform:uppercase}
.panel h2{margin:8px 0 6px;font-size:24px;font-weight:900;line-height:1.15}
.panel p{margin:8px 0;font-size:17px;line-height:1.45}
.panel ul{margin:6px 0 8px 0;padding-left:22px;font-size:17px;line-height:1.45}
.key{background:#FFF3D6;border:2px solid var(--ink);border-radius:12px;padding:8px 12px;margin:10px 0;font-size:16px}
.key b{color:#9C4A00}
.wow{background:#E9F7EF;border:2px solid var(--ink);border-radius:12px;padding:8px 12px;margin:10px 0;font-size:16px}
.q{background:#F1ECFA;border:2px solid var(--ink);border-radius:14px;padding:10px 12px;margin:12px 0}
.q .qt{font-weight:800;font-size:16.5px;margin-bottom:8px}
.q .qt::before{content:"🤔 ";}
.opt{display:block;width:100%;text-align:left;margin:5px 0;padding:8px 11px;font:600 15.5px Nunito,system-ui,sans-serif;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:10px;cursor:pointer;transition:transform .1s}
.opt:hover:not(:disabled){transform:translateX(3px);background:#FFFBEF}
.opt.right{background:#C7F0D8;border-color:#1B7A4B}
.opt.wrong{background:#FFD6D6;border-color:#B42318}
.opt:disabled{cursor:default}
.exp{display:none;margin-top:8px;font-size:15.5px;background:#fff;border-left:5px solid var(--green);border-radius:6px;padding:7px 10px}
.exp.show{display:block}
details{border:2px solid var(--ink);border-radius:12px;padding:7px 11px;margin:8px 0;background:#FFFDF6}
summary{cursor:pointer;font-weight:800;font-size:16px}
details p{font-size:16px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 10px}
.btn{font:800 15px Nunito,system-ui,sans-serif;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:11px;padding:7px 12px;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--gold)}
.btn.go{background:#95D5B2}
.btn.on{background:#95D5B2}
.btn.off{background:#E9ECEF;color:#6c757d}
.btn.pulse{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 3px 0 var(--ink),0 0 0 0 rgba(255,183,3,.7)}50%{box-shadow:0 3px 0 var(--ink),0 0 0 9px rgba(255,183,3,0)}}
.spacer{flex:1}
select{font:700 14px Nunito,system-ui,sans-serif;border:2px solid var(--ink);border-radius:9px;padding:5px}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dot{font:800 12.5px Nunito,system-ui,sans-serif;border:2px solid var(--ink);border-radius:999px;padding:4px 10px;background:#fff;cursor:pointer;color:var(--ink)}
.dot.done{background:#D8F3DC}
.dot.cur{background:var(--plum);color:#fff}
.popup{position:absolute;max-width:300px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px 13px;box-shadow:0 6px 0 rgba(43,45,66,.25);font-size:15.5px;line-height:1.4;display:none;z-index:5}
.popup h3{margin:0 0 4px;font-size:17px;font-weight:900}
.popup .x{position:absolute;right:8px;top:4px;cursor:pointer;font-weight:900}
.hint{position:absolute;left:12px;bottom:10px;background:rgba(255,255,255,.92);border:2px solid var(--ink);border-radius:999px;padding:3px 11px;font-weight:800;font-size:13px;pointer-events:none}
.lab-row{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:800;font-size:16px}
.lab-row .btn{min-width:86px}
input[type=range]{width:100%;accent-color:#E76F51}
.result{border:2px solid var(--ink);border-radius:12px;padding:9px 12px;margin-top:10px;font-size:16px;background:#F8F9FA;min-height:46px}
.score{font-weight:900;font-size:18px;background:var(--gold);border:2px solid var(--ink);border-radius:999px;padding:3px 12px;display:inline-block}
.small{font-size:14px;color:#555}
</style>
</head>
<body>
<div id="app">
  <header>
    <svg class="logo" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#fff" stroke="#2B2D42" stroke-width="3"/><path d="M24 38V22" stroke="#2B2D42" stroke-width="4" stroke-linecap="round"/><path d="M24 24c-10 0-12-8-12-10 6 0 12 2 12 10z" fill="#52B788" stroke="#2B2D42" stroke-width="2.5"/><path d="M24 22c8 0 11-7 11-9-6 0-11 2-11 9z" fill="#52B788" stroke="#2B2D42" stroke-width="2.5"/><ellipse cx="24" cy="39" rx="9" ry="3.5" fill="#8A5A36"/></svg>
    <div><h1>Seed Germination</h1><div class="sub">From a sleeping bean to a growing seedling</div></div>
    <div class="grade">Biology · Grade 9</div>
  </header>
  <div class="main">
    <div>
      <div class="stage" id="stage">
        <canvas id="cv" width="1000" height="600"></canvas>
        <div class="popup" id="popup"><span class="x" id="popx">✕</span><h3 id="poph"></h3><div id="popb"></div></div>
        <div class="hint" id="hint">👆 Click the labelled parts</div>
      </div>
      <div class="controls">
        <button class="btn" id="prev">◀ Back</button>
        <button class="btn primary" id="play">⏸ Pause</button>
        <button class="btn" id="replay">↺ Replay</button>
        <button class="btn go" id="next">Next ▶</button>
        <span class="spacer"></span>
        <label style="font-weight:800;font-size:14px">Speed
          <select id="speed"><option value="0.6">Slow</option><option value="1" selected>Normal</option><option value="1.6">Fast</option></select></label>
        <button class="btn off" id="narr">🗣 Narrate: off</button>
        <button class="btn on" id="snd">🔊 Sound</button>
      </div>
      <div class="dots" id="dots"></div>
    </div>
    <div class="panel" id="panel"></div>
  </div>
</div>
<script>
"use strict";
/* ============ helpers ============ */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=1000,H=600,GY=245,BX=500,BY=390,SRX=46,SRY=30,STEM=205;
let CAM={z:1,fy:300};
const cam=p=>p&&({x:500+(p.x-500)*CAM.z,y:300+(p.y-CAM.fy)*CAM.z});
const INK='#2B2D42';
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const seg=(g,a,b)=>clamp((g-a)/(b-a));
function hex(c){c=c.replace('#','');return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]}
function mix(a,b,t){const A=hex(a),B=hex(b);return'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],clamp(t)))).join(',')+')'}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const FONT='Nunito,system-ui,sans-serif';
function font(sz,w=800){ctx.font=w+' '+sz+'px '+FONT}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function circle(x,y,r,fill,stroke,lw=2){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}
function along(pts,d){if(!pts.length)return{x:0,y:0,done:true};for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],l=Math.hypot(b.x-a.x,b.y-a.y);if(d<=l&&l>0)return{x:a.x+(b.x-a.x)*d/l,y:a.y+(b.y-a.y)*d/l,done:false};d-=l}const e=pts[pts.length-1];return{x:e.x,y:e.y,done:true}}

/* label pill with leader line */
function tag(text,x,y,tx,ty,col='#7B2CBF',sz=16){
  font(sz,800);const w=ctx.measureText(text).width+24,h=sz+14;
  if(tx!=null){
    ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(tx,ty);ctx.stroke();
    circle(tx,ty,4.5,INK);circle(tx,ty,2.2,'#fff');
  }
  rr(x-w/2,y-h/2,w,h,h/2);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=INK;ctx.stroke();
  ctx.beginPath();ctx.arc(x-w/2+11,y,4.5,0,7);ctx.fillStyle=col;ctx.fill();
  ctx.fillStyle=INK;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,x+5,y+1);
}
function banner(text,y=34,col='#5A3E72'){
  font(22,900);const w=ctx.measureText(text).width+40;
  rr(W/2-w/2,y-20,w,40,20);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,W/2,y+1);
}
function dayPill(d){
  const txt='Day '+Math.round(d);font(18,900);
  rr(W-128,14,112,38,19);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
  ctx.fillStyle=INK;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('📅 '+txt,W-72,34);
}
function arrow(x1,y1,x2,y2,col,lw=5){
  const a=Math.atan2(y2-y1,x2-x1);
  ctx.lineCap='round';ctx.strokeStyle=INK;ctx.lineWidth=lw+3;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2-Math.cos(a)*8,y2-Math.sin(a)*8);ctx.stroke();
  ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.stroke();
  ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-Math.cos(a-.5)*16,y2-Math.sin(a-.5)*16);ctx.lineTo(x2-Math.cos(a+.5)*16,y2-Math.sin(a+.5)*16);ctx.closePath();
  ctx.fillStyle=col;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=INK;ctx.stroke();ctx.lineCap='butt';
}

/* ============ sound ============ */
let AC=null,soundOn=true;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function tone(f1,f2,dur,type='sine',vol=.08,delay=0){
  if(!soundOn)return;const a=ac();if(!a)return;try{
  const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+delay;
  o.type=type;o.frequency.setValueAtTime(f1,t0);o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.015);g.gain.exponentialRampToValueAtTime(.0005,t0+dur);
  o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+dur+.05)}catch(e){}
}
function noise(dur=.15,vol=.12){
  if(!soundOn)return;const a=ac();if(!a)return;try{
  const b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();f.type='highpass';f.frequency.value=1200;
  s.buffer=b;g.gain.value=vol;s.connect(f).connect(g).connect(a.destination);s.start()}catch(e){}
}
const sfx={drip:()=>tone(1100,420,.12,'sine',.05),crack:()=>{noise(.18,.18);setTimeout(()=>noise(.1,.12),110)},
  pop:()=>tone(500,900,.12,'triangle',.07),right:()=>{tone(660,660,.12,'triangle',.08);tone(990,990,.18,'triangle',.08,.11)},
  wrong:()=>tone(260,150,.25,'sawtooth',.04),grow:()=>tone(300,700,.5,'sine',.05),chime:()=>{tone(784,784,.2,'sine',.06);tone(1046,1046,.3,'sine',.06,.15);tone(1318,1318,.4,'sine',.05,.3)}};

/* ============ static textures ============ */
const R1=rng(7),SOIL=[];
for(let i=0;i<260;i++){const big=R1()<.12;SOIL.push({x:R1()*W,y:GY+8+R1()*(H-GY-8),r:big?3+R1()*6:1+R1()*2,c:big?['#A68A6D','#7D6650','#B9A58C','#6E5A48'][i%4]:['#5E3B22','#A0703F','#3F2715','#C08A55'][i%4],o:R1()})}
const PORES=[];for(let i=0;i<70;i++)PORES.push({x:R1()*W,y:GY+18+R1()*(H-GY-25),r:2.5+R1()*3});
const SPECK=[];{const r=rng(11);for(let i=0;i<46;i++){let u,v;do{u=r()*2-1;v=r()*1.6-.9}while(u*u+(v/.8)*(v/.8)>.9);SPECK.push({u,v,s:.03+r()*.06,a:r()*3,e:.4+r()*.5})}}
const STARCH=[];{const r=rng(5);for(let i=0;i<140;i++){let u,v;do{u=r()*2-1;v=r()*1.6-.9}while(u*u+(v/.75)*(v/.75)>.8);STARCH.push({u,v,s:.006+r()*.012})}}
const TUFTS=[40,95,170,250,330,395,610,690,760,845,920,975];

/* ============ seed shapes ============ */
function kidneyPath(rx,ry){
  const c=ctx;c.beginPath();c.moveTo(-rx,0);
  c.bezierCurveTo(-rx,-ry*1.15,rx,-ry*1.15,rx,0);
  c.bezierCurveTo(rx,ry,rx*.35,ry*1.05,rx*.12,ry*.7);
  c.bezierCurveTo(rx*.05,ry*.6,-rx*.05,ry*.6,-rx*.12,ry*.7);
  c.bezierCurveTo(-rx*.35,ry*1.05,-rx,ry,-rx,0);c.closePath();
}
const CRACK=[[.12,.62],[.26,.42],[.2,.24],[.38,.06],[.32,-.14],[.5,-.32],[.46,-.5]];
/* whole bean with coat; origin = seed centre */
function drawBean(rx,ry,o={}){
  const c=ctx,sw=o.swell||0;
  kidneyPath(rx,ry);c.fillStyle=mix('#D9AE77','#E8C796',sw);c.fill();
  c.save();kidneyPath(rx,ry);c.clip();
  SPECK.forEach(s=>{c.beginPath();c.ellipse(s.u*rx,s.v*ry,s.s*rx,s.s*rx*s.e,s.a,0,7);c.fillStyle=mix('#9B5E34','#B07A4D',sw);c.fill()});
  if(o.water){c.fillStyle='rgba(142,202,230,'+(o.water*.16)+')';c.fillRect(-rx,-ry*1.2,rx*2,ry*2.4)}
  c.beginPath();c.ellipse(-rx*.35,-ry*.45,rx*.38,ry*.18,-.25,0,7);c.fillStyle='rgba(255,255,255,.35)';c.fill();
  c.restore();
  kidneyPath(rx,ry);c.lineWidth=Math.max(2.5,rx*.03);c.strokeStyle=INK;c.stroke();
  // hilum
  c.beginPath();c.ellipse(0,ry*.66,rx*.15,ry*.075,0,0,7);c.fillStyle='#F6EEDC';c.fill();c.lineWidth=2;c.stroke();
  // micropyle
  circle(-rx*.24,ry*.74,Math.max(1.8,rx*.018),INK);
  // sparkles = processes switching on
  if(o.spark){for(let i=0;i<9;i++){const a=i*2.4,rad=.25+.45*((i*37)%10)/10,x=Math.cos(a)*rx*rad,y=Math.sin(a)*ry*rad*.8-ry*.1,
    tw=(Math.sin(now*5+i*1.7)+1)/2*o.spark;if(tw<.05)continue;star(x,y,4+tw*6,'#FFD60A',tw)}}
  // crack
  if(o.crack>0){const n=CRACK.length-1,f=o.crack*n;c.beginPath();c.moveTo(CRACK[0][0]*rx,CRACK[0][1]*ry);
    for(let i=1;i<=n;i++){const k=clamp(f-(i-1));if(k<=0)break;const a=CRACK[i-1],b=CRACK[i];c.lineTo(lerp(a[0],b[0],k)*rx,lerp(a[1],b[1],k)*ry)}
    c.lineWidth=5;c.strokeStyle=INK;c.lineJoin='round';c.stroke();c.lineWidth=2;c.strokeStyle='#F2DC9B';c.stroke()}
}
function star(x,y,r,col,a=1){const c=ctx;c.save();c.globalAlpha=a;c.translate(x,y);c.beginPath();for(let i=0;i<8;i++){const rad=i%2?r*.38:r;c.lineTo(Math.cos(i*Math.PI/4-Math.PI/2)*rad,Math.sin(i*Math.PI/4-Math.PI/2)*rad)}c.closePath();c.fillStyle=col;c.fill();c.lineWidth=1.2;c.strokeStyle=INK;c.stroke();c.restore()}
function leafShape(len,col){
  const c=ctx;c.beginPath();c.moveTo(0,0);c.bezierCurveTo(len*.62,-len*.1,len*.55,-len*.82,0,-len);c.bezierCurveTo(-len*.55,-len*.82,-len*.62,-len*.1,0,0);
  c.fillStyle=col;c.fill();c.lineWidth=2.4;c.strokeStyle=INK;c.stroke();
  c.beginPath();c.moveTo(0,-2);c.lineTo(0,-len*.9);c.lineWidth=1.6;c.strokeStyle='rgba(43,45,66,.55)';c.stroke();
  for(let i=1;i<4;i++){const y=-len*i*.22;c.beginPath();c.moveTo(0,y);c.lineTo(len*.25,y-len*.12);c.moveTo(0,y);c.lineTo(-len*.25,y-len*.12);c.stroke()}
}

/* ============ the germinating plant ============
 state: s swell, c crack, r radicle, rx root extra, h shoot, o open (hook straighten + cotyledons), L true leaves, k cotyledon shrink */
function stateFromG(g){return{s:seg(g,0,.15),c:seg(g,.15,.25),r:seg(g,.25,.45),rx:seg(g,.45,1),h:seg(g,.45,.75),o:seg(g,.75,.9),L:seg(g,.8,1),k:0}}
let GEO=null;
function drawPlant(st,bx,by,sc,env={}){
  const c=ctx;c.save();c.translate(bx,by);c.scale(sc,sc);
  const geo={root:[],stem:[]};const W_=(x,y)=>({x:bx+sc*x,y:by+sc*y});
  const pale=env.dark;
  // ---- root ----
  let Lr=st.r*130+st.rx*62;if(st.c>.6&&st.r<=0)Lr=(st.c-.6)*24;
  if(Lr>.5){
    const N=30,pts=[];for(let i=0;i<=N;i++){const f=i/N;pts.push({x:7*Math.sin(f*2.4)*f,y:Lr*f,w:5*(1-.72*f)*Math.min(1,.35+Lr/40)})}
    // lateral roots
    const lat=clamp((st.rx-.12)/.88);
    if(lat>0){[[.22,1],[.34,-1],[.47,1],[.6,-1],[.7,1]].forEach(([f,sd],i)=>{const p=pts[Math.round(f*N)],len=(62-i*8)*lat;
      c.beginPath();c.moveTo(p.x,p.y);c.quadraticCurveTo(p.x+sd*len*.6,p.y+len*.15,p.x+sd*len,p.y+len*.55);
      c.lineCap='round';c.lineWidth=5;c.strokeStyle=INK;c.stroke();c.lineWidth=2.6;c.strokeStyle='#F3E6C9';c.stroke()})}
    // root hairs
    const hair=clamp((st.r-.45)/.3);
    if(hair>0){for(let i=Math.round(N*.42);i<Math.round(N*.88);i++){const p=pts[i];for(const sd of[-1,1]){const l=(6+((i*7)%5))*hair;
      c.beginPath();c.moveTo(p.x+sd*p.w,p.y);c.lineTo(p.x+sd*(p.w+l),p.y+l*.35);c.lineWidth=2.6;c.strokeStyle=INK;c.stroke();c.lineWidth=1.3;c.strokeStyle='#FFF8E8';c.stroke()}}}
    c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p.x+p.w,p.y):c.moveTo(p.x+p.w,p.y));

/* water & minerals entering root hairs then travelling up */
function spawnRootFlow(geo,rate,dt){
  if(!geo||geo.root.length<10)return;
  if(Math.random()<rate*dt){const N=geo.root.length-1,i=Math.round(N*(.45+Math.random()*.4)),p=geo.root[i],sd=Math.random()<.5?-1:1;
    parts.push({k:'rf',type:Math.random()<.7?'w':'min',sx:p.x+sd*(26+Math.random()*16),sy:p.y+Math.random()*14-7,i,t:0,d:0})}
}
function flowPath(geo,i){return geo.root.slice(0,i+1).reverse().concat(geo.stem)}
function updateParts(dt,geo){
  for(const p of parts){
    if(p.k==='w'){const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);p.x+=dx/d*70*dt+Math.sin(now*6+p.ph)*.4;p.y+=dy/d*70*dt;if(d<9){p.dead=true;absorbed++;if(Math.random()<.35)sfx.drip()}}
    else if(p.k==='rf'){p.t+=dt;if(!geo||!geo.root[p.i]){p.dead=true;continue}
      if(p.t<.7){const q=p.t/.7,tp=geo.root[p.i];p.x=lerp(p.sx,tp.x,q);p.y=lerp(p.sy,tp.y,q)}
      else{p.d+=110*dt;const pos=along(flowPath(geo,p.i),p.d);p.x=pos.x;p.y=pos.y;if(pos.done)p.dead=true}}
    else if(p.k==='mol'){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t>p.life)p.dead=true}
    else if(p.k==='glu'){p.d+=95*dt;const pos=along(p.path==='down'?gluDown(geo):gluUp(geo),p.d);p.x=pos.x;p.y=pos.y;if(pos.done)p.dead=true}
  }
  parts=parts.filter(p=>!p.dead);
}

  for(const p of parts){

const LAB={water:true,o2:true,temp:22,light:true,g:0,target:0,running:false,day:0,msg:''};
function tempF(T){if(T<=4)return 0;if(T<15)return(T-4)/11*.7;if(T<=30)return 1;if(T<40)return 1-(T-30)/10;return 0}
function labOutcome(){
  const L=LAB;if(!L.water)return{g:0,m:'❌ <b>No germination.</b> Without water the seed stays dry and dormant – nothing inside can switch on.'};
  if(!L.o2)return{g:.1,m:'❌ The seed swelled with water… then stopped. Waterlogged soil has <b>no oxygen</b>, so the seed cannot <b>respire</b> – no energy for growth.'};
  const f=tempF(L.temp);
  if(f===0)return{g:L.temp<10?.02:0,m:L.temp<10?'❌ <b>Too cold!</b> The processes inside the seed are far too slow – it stays dormant.':'❌ <b>Too hot!</b> The seed is damaged and cannot grow.'};
  if(f<1)return{g:.15+f*.6,m:'⚠️ It germinated, but <b>slowly</b>. The temperature is not ideal (best ≈ 20–30 °C for beans).'};
  if(!L.light)return{g:.85,m:'✅ <b>It germinated in the dark!</b> Seeds don’t need light to germinate – they use stored food. But look: the seedling is <b>pale yellow</b>, tall and thin, and its hook is still closed. It needs light soon to make chlorophyll and photosynthesise.'};
  return{g:1,m:'✅ <b>Success!</b> Water + Oxygen + Warmth = germination. 🌱'};
}

  draw(){
    const L=LAB,st=stateFromG(L.g);const et=!L.light&&L.g>.45;if(et){st.o=Math.min(st.o,.12);st.L=0}
    world(st,{etiol:et,sun:L.light,dark:!L.light,dry:!L.water,flood:L.water&&!L.o2,o2:L.o2,cold:L.temp<=4});
    drawParts();
    // thermometer
    const T=L.temp,tx=46,ty=280;rr(tx-13,ty,26,230,13);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
    const fh=200*clamp(T/50);const col=T<=4?'#4CC9F0':T>=40?'#D62828':tempF(T)===1?'#2A9D8F':'#F4A261';
    rr(tx-6,ty+215-fh,12,fh+8,6);ctx.fillStyle=col;ctx.fill();circle(tx,ty+228,19,col,INK,3);
    font(16,900);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(T+'°',tx,ty+230);
    // 20-30 zone mark
    ctx.fillStyle='rgba(82,183,136,.35)';ctx.fillRect(tx+14,ty+215-200*30/50,10,200*10/50);
    // status chips
    const chip=(x,txt,ok)=>{font(15,800);const w=ctx.measureText(txt).width+34;rr(x,560,w,30,15);ctx.fillStyle=ok?'#C7F0D8':'#FFD6D6';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=INK;ctx.stroke();ctx.fillStyle=INK;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText((ok?'✔ ':'✘ ')+txt,x+12,576);return w};
    let x=290;x+=chip(x,'Water',L.water)+8;x+=chip(x,'Oxygen',L.o2)+8;x+=chip(x,'Warmth',tempF(T)===1)+8;chip(x,L.light?'Light (not needed!)':'Dark',true);
    if(!L.light)tag('Dark box 🌑',150,40,null,null,'#5A3E72',16);
    if(L.water&&!L.o2)tag('Waterlogged soil – no air',780,GY+30,null,null,'#219EBC',15);
    if(!L.water)tag('Dry soil',780,GY+30,null,null,'#CDA877',15);
    if(L.temp>=40){font(30,900);ctx.fillStyle='rgba(214,40,40,.6)';ctx.textAlign='center';ctx.fillText('🔥 hot',820,140)}
    dayPill(L.day);banner('Conditions lab: test W-O-W',34,'#2D6A4F');
  },
  hot(){return[{x:46,y:400,r:40,t:'Temperature',b:'Most seeds have a <b>best temperature</b> range. For beans it is about <b>20–30 °C</b>. Too cold → processes are too slow. Too hot → the seed is damaged.'}]}
});

/* --- 9 three seeds activity --- */
let actT=0,actGo=false;
Qs.act={q:'1. Which seed is most likely to germinate?',opts:['Seed A','Seed B','Seed C'],ans:0,exp:'<b>Seed A</b> – it has all three necessary conditions: water, oxygen and warmth.',onAnswer(){actGo=true;actT=0;sfx.grow()}};
S.push({name:'Activity',
  panel:()=>P('Classroom activity · 3 min','Three bean seeds 🫘🫘🫘',`<p>You put three bean seeds in different conditions:</p>
  <table style="width:100%;border-collapse:collapse;font-size:16px;margin:6px 0"><tr style="background:#F1ECFA"><th style="border:2px solid #2B2D42;padding:5px">Seed</th><th style="border:2px solid #2B2D42;padding:5px">Conditions</th></tr>
  <tr><td style="border:2px solid #2B2D42;padding:5px;text-align:center"><b>A</b></td><td style="border:2px solid #2B2D42;padding:5px">Water, oxygen and warmth</td></tr>
  <tr><td style="border:2px solid #2B2D42;padding:5px;text-align:center"><b>B</b></td><td style="border:2px solid #2B2D42;padding:5px">Completely dry</td></tr>
  <tr><td style="border:2px solid #2B2D42;padding:5px;text-align:center"><b>C</b></td><td style="border:2px solid #2B2D42;padding:5px">Water, but no oxygen</td></tr></table>
  ${qHTML('act')}
  <details><summary>2. Why will seed B not germinate?</summary><p>It has <b>no water</b>. Without water the seed cannot swell, soften or switch on its activities – it stays dormant.</p></details>
  <details><summary>3. Why is oxygen important?</summary><p>Oxygen is needed for <b>respiration</b>, which <b>releases energy</b> from the stored food. No oxygen → no energy → no growth.</p></details>`),
  say:'You put three bean seeds in different conditions. Seed A has water, oxygen and warmth. Seed B is completely dry. Seed C has water but no oxygen. Which seed is most likely to germinate?',
  enter(){actT=0;actGo=!!Qs.act.done;if(actGo)actT=1},
  update(dt){if(actGo)actT=Math.min(1,actT+dt/5)},
  draw(){
    ctx.fillStyle='#FAF8F3';ctx.fillRect(0,0,W,H);
    const jars=[{n:'A',x:175,lab:'💧 + 🫧 + 🌡️',g:1,env:{}},{n:'B',x:500,lab:'Dry',g:0,env:{dry:true}},{n:'C',x:825,lab:'💧 no 🫧',g:.1,env:{flood:true}}];
    const e=ease(actT);
    jars.forEach(j=>{
      const x0=j.x-140,y0=90,w=280,h=440,gy=330;
      ctx.save();rr(x0,y0,w,h,22);ctx.clip();
      ctx.fillStyle='#EAF6FB';ctx.fillRect(x0,y0,w,h);
      const sg=ctx.createLinearGradient(0,gy,0,y0+h);sg.addColorStop(0,j.env.dry?'#CDA877':'#8A5A36');sg.addColorStop(1,j.env.dry?'#A98454':'#4E321D');ctx.fillStyle=sg;ctx.fillRect(x0,gy,w,h);
      SOIL.slice(0,60).forEach(p=>{circle(x0+p.x/W*w,gy+8+(p.y-GY)/(H-GY)*(y0+h-gy-10),p.r*.7,p.c)});
      if(j.env.flood){ctx.fillStyle='rgba(70,150,205,.45)';ctx.fillRect(x0,y0+40,w,h);ctx.beginPath();ctx.moveTo(x0,y0+40);for(let xx=0;xx<=w;xx+=20)ctx.lineTo(x0+xx,y0+40+Math.sin(xx*.06+now*2)*3);ctx.lineWidth=2.5;ctx.strokeStyle='#219EBC';ctx.stroke()}
      const st=stateFromG(j.g*e*(j.n==='A'?.92:1));
      drawPlant(st,j.x,gy+95,.62,{});
      ctx.restore();
      rr(x0,y0,w,h,22);ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke();
      // glass shine
      ctx.beginPath();ctx.moveTo(x0+20,y0+30);ctx.lineTo(x0+20,y0+h-60);ctx.lineWidth=6;ctx.strokeStyle='rgba(255,255,255,.6)';ctx.stroke();
      circle(j.x,y0-6,26,'#5A3E72',INK,3);font(26,900);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(j.n,j.x,y0-5);
      tag(j.lab,j.x,y0+h+30,null,null,j.n==='A'?'#2A9D8F':j.n==='B'?'#CDA877':'#219EBC',16);
      if(actT>=1){font(46,900);ctx.textAlign='center';ctx.fillText(j.n==='A'?'✅':'❌',j.x+105,y0+40)}
    });
    if(!actGo){font(20,900);ctx.fillStyle=INK;ctx.textAlign='center';ctx.fillText('Predict first – then answer in the panel →',W/2,40)}
  }
});

/* --- 10 quiz --- */
let quizScore=0,quizG=.25;
const QZ=[
 ['What is germination?',['The making of seeds by a flower','The process by which a seed begins to grow and develops into a young plant','The process by which a plant makes food using light','The death of a seed'],1,'Germination = a seed begins to grow and develops into a young plant.'],
 ['What is usually the first part of the seed to emerge?',['The plumule','The first leaves','The radicle','The cotyledons'],2,'The <b>radicle</b> (embryonic root) comes out first.'],
 ['What are the three conditions necessary for germination?',['Water, light and soil','Water, oxygen and a suitable temperature','Sunlight, carbon dioxide and warmth','Minerals, water and light'],1,'Remember <b>W-O-W</b>: Water, Oxygen, Warmth.'],
 ['Where does the seed get its food before leaves develop?',['From the soil through the roots','From sunlight','From stored food reserves in the seed (cotyledons)','From the air'],2,'From its <b>stored food</b>: carbohydrates, proteins and fats.'],
 ['When does the young plant begin photosynthesis?',['As soon as water enters the seed','When the seed coat breaks','When the root appears','When the first green leaves develop'],3,'Photosynthesis begins when the <b>first green leaves</b> open.']];
QZ.forEach((q,i)=>{Qs['z'+i]={q:(i+1)+'. '+q[0],opts:q[1],ans:q[2],exp:q[3],onAnswer(first){if(first){quizScore++;}const s=document.getElementById('qscore');if(s)s.textContent=quizScore+' / 5';sfx.grow()}}});
S.push({name:'Quiz',
  panel:()=>P('Final assessment · 2 min','Quick quiz 🏆',`<p>Every <b>first-try</b> correct answer helps the seedling grow! 🌱 Score: <span class="score" id="qscore">${quizScore} / 5</span></p>${QZ.map((q,i)=>qHTML('z'+i)).join('')}`),
  say:'Quick quiz. Every correct answer helps the seedling grow.',
  update(dt){const target=.22+quizScore*.156;quizG+=(target-quizG)*Math.min(1,dt*1.5);if(GEO&&quizScore>=5)spawnPhoto(GEO,3,dt)},
  draw(){const st=stateFromG(quizG);world(st,{sun:quizScore>=4});drawParts();
    for(let i=0;i<5;i++)star(780+i*42,90,16,i<quizScore?'#FFD60A':'#E9ECEF');
    banner(quizScore>=5?'Perfect! A healthy seedling 🌿':'Answer to grow the seedling',34,'#5A3E72');
    if(quizScore>=5)tag('Germination expert! 🎓',820,140,null,null,'#FFD60A',16);
  }
});

/* --- 11 summary --- */
S.push({name:'Summary',
  panel:()=>P('Whiteboard notes','Remember these 3 things ✅',`<ol style="font-size:17px;line-height:1.5;padding-left:22px"><li><b>What happens?</b> A seed develops into a young plant (germination).</li><li><b>What does it need?</b> Water, oxygen and a suitable temperature – <b>W-O-W</b>.</li><li><b>Where does it get energy?</b> From stored food reserves (carbohydrates, proteins, fats) – until its leaves can photosynthesise.</li></ol><div class="key">Order: water in → coat breaks → <b>root</b> (radicle) → <b>shoot</b> (plumule) → seedling</div><p class="small">Use ◀ Back to replay any step.</p>`),
  say:'Remember three things. A seed develops into a young plant. It needs water, oxygen and warmth. It gets its energy from stored food reserves until its leaves can photosynthesise.',
  draw(){
    ctx.fillStyle='#F7F7F2';ctx.fillRect(0,0,W,H);
    rr(14,14,W-28,H-28,18);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#ADB5BD';ctx.stroke();
    font(32,900);ctx.fillStyle='#2D6A4F';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('SEED GERMINATION',W/2,52);
    font(16,700);ctx.fillStyle=INK;ctx.fillText('The process by which a seed begins to grow into a young plant',W/2,84);
    // mini timeline
    const stages=[[.12,'1. Water in'],[.24,'2. Coat breaks'],[.42,'3. Root (radicle)'],[.7,'4. Shoot (plumule)'],[1,'5. Seedling']];
    const gy=270;ctx.fillStyle='#8A5A36';rr(40,gy,W-80,110,12);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
    ctx.save();rr(40,90,W-80,290,12);ctx.clip();
    stages.forEach(([g,l],i)=>{const x=125+i*187;const st=stateFromG(g);drawPlant(st,x,gy+42,.5,{})});ctx.restore();
    stages.forEach(([g,l],i)=>{const x=125+i*187;tag(l,x,gy+138,null,null,['#8ECAE6','#E76F51','#F4A261','#52B788','#2A9D8F'][i],15);if(i<4)arrow(x+70,gy-90,x+115,gy-90,'#FFB703',4)});
    // boxes
    const box=(x,title,lines,col)=>{rr(x,450,290,120,14);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();font(18,900);ctx.fillStyle=INK;ctx.textAlign='left';ctx.fillText(title,x+16,474);font(16,700);lines.forEach((l,i)=>ctx.fillText(l,x+16,503+i*24))};
    box(40,'Conditions = W-O-W',['💧 Water','🫧 Oxygen','🌡️ Suitable temperature'],'#E9F7EF');
    box(355,'Food reserves 🍱',['🟡 Carbohydrates','🔵 Proteins','🟠 Fats'],'#FFF3D6');
    box(670,'Remember!',['Seeds use stored food','before they can make food','by photosynthesis ☀️'],'#F1ECFA');
  }
});

/* ============ UI ============ */
const panel=document.getElementById('panel'),dotsEl=document.getElementById('dots'),hint=document.getElementById('hint');
function renderDots(){dotsEl.innerHTML=S.map((s,i)=>`<button class="dot ${i===cur?'cur':visited.has(i)?'done':''}" data-i="${i}">${i+1}. ${s.name}</button>`).join('')}
dotsEl.onclick=e=>{const b=e.target.closest('.dot');if(b)go(+b.dataset.i)};
let narrate=false;
function speak(txt){try{speechSynthesis.cancel();if(!narrate)return;const u=new SpeechSynthesisUtterance(txt);u.lang='en-GB';u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
function go(i){
  cur=clamp(i,0,S.length-1);t=0;parts=[];CAM={z:1,fy:300};sceneTime=0;visited.add(cur);hidePop();
  const s=S[cur];panel.innerHTML=s.panel();s.bind&&s.bind();s.enter&&s.enter();
  // restore answered state
  panel.querySelectorAll('.q').forEach(qd=>{const id=qd.id.slice(2),q=Qs[id];if(q&&q.done){qd.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q.ans)b.classList.add('right')});document.getElementById('e_'+id).classList.add('show')}});
  playing=true;updPlay();renderDots();
  hint.style.display=s.hot?'block':'none';clearTimeout(window._ht);window._ht=setTimeout(()=>hint.style.display='none',7000);hint.textContent=cur===1?'👆 Click the labelled parts':'👆 Click the picture to learn more';
  document.getElementById('next').classList.remove('pulse');
  speak(s.say);
}
function updPlay(){document.getElementById('play').textContent=playing?'⏸ Pause':'▶ Play'}
document.getElementById('play').onclick=()=>{ac();if(S[cur].dur&&t>=1){t=0;parts=[];S[cur].enter&&S[cur].enter()}playing=!playing;updPlay()};
document.getElementById('replay').onclick=()=>{ac();go(cur)};
document.getElementById('next').onclick=()=>{ac();go(cur+1)};
document.getElementById('prev').onclick=()=>{ac();go(cur-1)};
document.getElementById('speed').onchange=e=>speed=+e.target.value;
document.getElementById('snd').onclick=e=>{soundOn=!soundOn;e.target.className='btn '+(soundOn?'on':'off');e.target.textContent=soundOn?'🔊 Sound':'🔇 Sound'};
document.getElementById('narr').onclick=e=>{narrate=!narrate;e.target.className='btn '+(narrate?'on':'off');e.target.textContent='🗣 Narrate: '+(narrate?'on':'off');if(narrate)speak(S[cur].say);else try{speechSynthesis.cancel()}catch(_){}};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);if(e.key===' '){e.preventDefault();document.getElementById('play').click()}});

/* popups */
const pop=document.getElementById('popup');
function hidePop(){pop.style.display='none'}
document.getElementById('popx').onclick=hidePop;
function canvasXY(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H,r}}
function hitTest(x,y){const s=S[cur];if(!s.hot)return null;return s.hot().find(h=>Math.hypot(h.x-x,h.y-y)<h.r)||null}
cv.addEventListener('mousemove',e=>{const {x,y}=canvasXY(e);cv.style.cursor=hitTest(x,y)?'pointer':'default'});
cv.addEventListener('click',e=>{ac();const {x,y,r}=canvasXY(e);const h=hitTest(x,y);if(!h){hidePop();return}
  document.getElementById('poph').innerHTML=h.t;document.getElementById('popb').innerHTML=h.b;pop.style.display='block';sfx.pop();
  const px=(h.x/W)*r.width,py=(h.y/H)*r.height,pw=pop.offsetWidth,ph=pop.offsetHeight;
  pop.style.left=Math.max(8,Math.min(r.width-pw-8,px+20))+'px';pop.style.top=Math.max(8,Math.min(r.height-ph-8,py-ph/2))+'px'});

/* canvas sizing */
function resize(){const r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*d);cv.height=Math.round(r.width*.6*d)}
window.addEventListener('resize',resize);

/* main loop */
let last=performance.now();
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000);last=ts;now+=dt;sceneTime+=dt;
  const s=S[cur];
  if(playing&&s.dur){t=Math.min(1,t+dt*speed/s.dur);if(t>=1){playing=false;updPlay();document.getElementById('next').classList.add('pulse')}}
  try{
    s.update&&s.update(dt*speed);
    updateParts(dt*speed,GEO);
    ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);ctx.clearRect(0,0,W,H);ctx.setLineDash([]);ctx.globalAlpha=1;
    GEO=null;s.draw(t);
  }catch(err){console.error(err)}
  requestAnimationFrame(loop);
}
resize();go(0);requestAnimationFrame(loop);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
</script>
