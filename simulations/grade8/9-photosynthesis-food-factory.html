<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photosynthesis – The Plant's Food Factory · Grade 8</title>
<style>
:root{--ink:#2B2D42;--bg:#FAF8F3;--green:#2A9D8F;--gold:#FFB703;--navy:#14213D;--red:#E63946}
*{box-sizing:border-box}
body{margin:0;background:#E9E4D8;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
.app{max-width:1200px;margin:0 auto;padding:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--navy);color:#fff;border-radius:16px 16px 0 0;padding:10px 18px;border:3px solid var(--ink);border-bottom:none}
header h1{font-size:19px;margin:0;line-height:1.2}
header .sub{font-size:13px;opacity:.75;font-weight:500}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:32px;height:32px;border-radius:50%;border:2px solid #ffffff66;background:transparent;color:#fff;font-weight:700;cursor:pointer;font-size:13px;font-family:inherit}
.dot:hover{border-color:#fff}
.dot.done{background:var(--green);border-color:var(--green)}
.dot.on{background:var(--gold);color:var(--ink);border-color:#fff}
.stage{position:relative;background:var(--bg);border:3px solid var(--ink);border-top:none;border-bottom:none;overflow:hidden}
canvas{display:block;width:100%;height:auto}
.ov{position:absolute;display:none;font-size:clamp(12px,1.45vw,17px)}
.ov.show{display:block}
.btn{font-family:inherit;font-weight:700;border:2.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:.45em 1em;cursor:pointer;font-size:inherit}
.btn:hover{background:#FFF3D6}
.btn.primary{background:var(--gold)}
.btn.sel{background:var(--green);color:#fff}
/* question card */
#qcard{left:50%;top:50%;transform:translate(-50%,-50%);width:min(64%,640px);background:#fff;border:3px solid var(--ink);border-radius:20px;padding:1.1em 1.3em;box-shadow:0 8px 0 #2B2D4222}
#qcard .tag{display:inline-block;background:#FFB70333;border:2px solid var(--ink);border-radius:999px;padding:.1em .7em;font-weight:800;font-size:.8em;letter-spacing:.06em}
#qcard h3{margin:.5em 0 .7em;font-size:1.25em;line-height:1.3}
#qcard .opts{display:flex;flex-direction:column;gap:.45em}
#qcard .opt{text-align:left;border-radius:14px}
#qcard .opt.right{background:#2A9D8F;color:#fff}
#qcard .opt.wrong{background:#E63946;color:#fff}
#qcard .fb{margin-top:.8em;line-height:1.45;display:none}
#qcard .fb.show{display:block}
/* popup */
#pop{width:min(36%,330px);background:#fff;border:3px solid var(--ink);border-radius:16px;padding:.8em 1em;box-shadow:0 6px 0 #2B2D4222;z-index:5}
#pop h4{margin:0 0 .35em;font-size:1.08em;padding-right:1.4em}
#pop p{margin:0;line-height:1.45}
#pop .x{position:absolute;right:.5em;top:.35em;border:none;background:none;font-size:1.3em;cursor:pointer;color:var(--ink)}
/* balance */
#bal{left:50%;bottom:2.5%;transform:translateX(-50%);display:none;gap:.8em;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:.45em .9em;white-space:nowrap}
#bal.show{display:flex}
.stp{display:flex;align-items:center;gap:.35em;font-weight:800;font-size:1.1em}
.stp button{width:1.8em;height:1.8em;border-radius:50%;border:2.5px solid var(--ink);background:#FFF3D6;font-weight:800;cursor:pointer;font-size:.9em;font-family:inherit}
.stp .n{min-width:1.1em;text-align:center;color:var(--red);font-size:1.15em}
.sep{font-weight:800;font-size:1.2em}
/* factors */
#fac{right:1.5%;bottom:2.5%;width:44%;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:.6em .8em}
#fac .row{display:flex;align-items:center;justify-content:space-between;gap:.4em;margin:.25em 0}
#fac .lab{font-weight:800;min-width:7.5em}
#fac .seg{display:flex;gap:.25em}
#fac .seg .btn{padding:.25em .65em;font-size:.88em}
#fac .scen{display:flex;flex-wrap:wrap;gap:.3em;margin-top:.45em;padding-top:.45em;border-top:2px dashed #2B2D4255}
#fac .scen .btn{padding:.25em .6em;font-size:.82em;background:#F1F8EA}
/* quiz */
#quiz{left:4%;right:4%;top:4%;bottom:4%;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:1em 1.4em;overflow:auto}
#quiz h3{margin:.1em 0 .2em}
#quiz .qq{margin:.45em 0;padding:.4em .8em;border:2px solid #2B2D4233;border-radius:14px}
#quiz .qq b{display:block;margin-bottom:.35em}
#quiz .ch{display:inline-flex;margin:.15em .3em .15em 0}
#quiz .ch .btn{font-weight:600;padding:.3em .9em}
#quiz .ex{display:none;margin-top:.35em;font-size:.92em}
#quiz.checked .ex{display:block}
#quiz .score{font-weight:800;font-size:1.2em;margin-left:.6em}
/* controls */
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:3px solid var(--ink);border-top:2px solid #2B2D4233;padding:8px 12px}
.controls .btn{font-size:15px;padding:6px 14px}
.controls .sp{flex:1}
.controls select{font-family:inherit;font-weight:700;border:2.5px solid var(--ink);border-radius:999px;padding:5px 10px;font-size:14px;background:#fff}
.stepc{font-weight:700;font-size:14px;opacity:.75}
.info{background:#fff;border:3px solid var(--ink);border-top:none;border-radius:0 0 16px 16px;padding:12px 18px 14px;min-height:96px}
.info .ptitle{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--green)}
.info h2{margin:2px 0 6px;font-size:21px}
.info p,.info li{margin:0;font-size:16.5px;line-height:1.5}
.info ol{margin:4px 0 0;padding-left:22px}
.info .hint{margin-top:6px;font-size:14px;opacity:.7}
@media (max-width:700px){#fac{width:62%}#qcard{width:86%}#pop{width:60%}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>🌿 Photosynthesis – The Plant's Food Factory</h1><div class="sub">Grade 8 Biology · Reactants, products &amp; the chemical equation</div></div>
    <div class="dots" id="dots"></div>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" width="1280" height="720" aria-label="Photosynthesis simulation"></canvas>
    <div class="ov" id="qcard"></div>
    <div class="ov" id="pop"><button class="x" aria-label="Close">×</button><h4></h4><p></p></div>
    <div class="ov" id="bal">
      <div class="stp"><button data-k="a" data-d="-1">−</button><span class="n" id="na">1</span><span>CO₂</span><button data-k="a" data-d="1">+</button></div>
      <span class="sep">+</span>
      <div class="stp"><button data-k="b" data-d="-1">−</button><span class="n" id="nb">1</span><span>H₂O</span><button data-k="b" data-d="1">+</button></div>
      <span class="sep">→</span>
      <div class="stp"><span class="n" style="color:var(--ink)">1</span><span>C₆H₁₂O₆</span></div>
      <span class="sep">+</span>
      <div class="stp"><button data-k="c" data-d="-1">−</button><span class="n" id="nc">1</span><span>O₂</span><button data-k="c" data-d="1">+</button></div>
    </div>
    <div class="ov" id="fac">
      <div class="row"><span class="lab">☀️ Light</span><div class="seg" data-f="L"></div></div>
      <div class="row"><span class="lab">💨 CO₂</span><div class="seg" data-f="C"></div></div>
      <div class="row"><span class="lab">💧 Water</span><div class="seg" data-f="W"></div></div>
      <div class="scen">
        <button class="btn" data-s="dark">🌑 Almost no light</button>
        <button class="btn" data-s="dry">🏜️ Dry soil</button>
        <button class="btn" data-s="co2">💨 Very little CO₂</button>
        <button class="btn" data-s="all">✅ All high</button>
      </div>
    </div>
    <div class="ov" id="quiz"></div>
  </div>
  <div class="controls">
    <button class="btn" id="bBack">◀ Back</button>
    <button class="btn primary" id="bNext">Next ▶</button>
    <span class="stepc" id="stepc"></span>
    <span class="sp"></span>
    <button class="btn" id="bPause">⏸ Pause</button>
    <button class="btn" id="bReset">⟲ Restart</button>
    <select id="speed" aria-label="Speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select>
    <button class="btn" id="bVoice">🔇 Narration off</button>
    <button class="btn" id="bSound">🔈 Sound on</button>
  </div>
  <div class="info" id="info"></div>
</div>
<script>
"use strict";
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=1280,H=720;
function fit(){const r=Math.min(window.devicePixelRatio||1,2);cv.width=W*r;cv.height=H*r;ctx.setTransform(r,0,0,r,0,0);}
fit();window.addEventListener('resize',fit);

const C={ink:'#2B2D42',bg:'#FAF8F3',navy:'#14213D',chl:'#2A9D8F',leaf:'#6BBF73',glu:'#FFB703',water:'#8ECAE6',o2:'#4CC9F0',co2:'#6C757D',co2l:'#ADB5BD',light:'#FFE066',sun:'#FFD166',sky:'#E8F4FA',red:'#E63946',wall:'#8AB17D',cyto:'#FFF3D6'};
const FONT='Inter,system-ui,-apple-system,"Segoe UI",sans-serif';

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function fs(fill,lw=2.5,stroke=C.ink){if(fill){ctx.fillStyle=fill;ctx.fill();}if(lw){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke();}}
function ball(x,y,r,fill,lw=2.2){ctx.beginPath();ctx.arc(x,y,r,0,7);fs(fill,lw);ctx.beginPath();ctx.arc(x-r*.35,y-r*.35,r*.28,0,7);ctx.fillStyle='rgba(255,255,255,.55)';ctx.fill();}
function txt(s,x,y,size=18,color=C.ink,align='center',weight=700){ctx.font=`${weight} ${size}px ${FONT}`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function tw(s,size,weight=700){ctx.font=`${weight} ${size}px ${FONT}`;return ctx.measureText(s).width;}
function pill(s,x,y,o={}){const size=o.size||17,w=tw(s,size,o.weight||700)+size*1.3,h=size*1.9;let px=x-w/2;if(o.align==='left')px=x;if(o.align==='right')px=x-w;rr(px,y-h/2,w,h,h/2);fs(o.bg||'#fff',o.lw||2.5);txt(s,px+w/2,y+1,size,o.color||C.ink,'center',o.weight||700);return{x:px,y:y-h/2,w,h};}
function leader(s,tx,ty,lx,ly,o={}){ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(lx,ly);ctx.lineWidth=2;ctx.strokeStyle=C.ink;ctx.stroke();ctx.beginPath();ctx.arc(tx,ty,4.5,0,7);ctx.fillStyle=C.ink;ctx.fill();pill(s,lx,ly,o);}
function arrow(x1,y1,x2,y2,lw=5,col=C.ink){const a=Math.atan2(y2-y1,x2-x1),hl=lw*3.2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2-Math.cos(a)*hl*.8,y2-Math.sin(a)*hl*.8);ctx.lineWidth=lw;ctx.strokeStyle=col;ctx.lineCap='round';ctx.stroke();ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-Math.cos(a-.45)*hl,y2-Math.sin(a-.45)*hl);ctx.lineTo(x2-Math.cos(a+.45)*hl,y2-Math.sin(a+.45)*hl);ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.lineCap='butt';}
function caption(s){pill(s,640,44,{size:22,bg:'#fff',lw:3});}
function mix(a,b,f){const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const A=p(a),B=p(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*f)).join(',')+')';}

/* molecules */
function drawCO2(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ball(-14,0,9,C.co2l,2);ball(14,0,9,C.co2l,2);ball(0,0,11,C.co2,2);ctx.restore();}
function drawO2(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ball(-8,0,9,C.o2,2);ball(8,0,9,C.o2,2);ctx.restore();}
function drawDrop(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();ctx.moveTo(0,-15);ctx.quadraticCurveTo(10,-2,9,5);ctx.arc(0,5,9,0,Math.PI);ctx.quadraticCurveTo(-10,-2,0,-15);ctx.closePath();fs(C.water,2);ctx.beginPath();ctx.arc(-3,3,2.6,0,7);ctx.fillStyle='rgba(255,255,255,.7)';ctx.fill();ctx.restore();}
function drawGlu(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3;ctx.lineTo(Math.cos(a)*13,Math.sin(a)*13);}ctx.closePath();fs(C.glu,2.2);ctx.beginPath();ctx.arc(-4,-4,3,0,7);ctx.fillStyle='rgba(255,255,255,.6)';ctx.fill();ctx.restore();}
function drawPhoton(x,y,s=1){ctx.save();ctx.shadowColor='#FFE066';ctx.shadowBlur=16;ctx.beginPath();ctx.arc(x,y,7*s,0,7);ctx.fillStyle=C.light;ctx.fill();ctx.restore();ctx.beginPath();ctx.arc(x,y,7*s,0,7);ctx.lineWidth=1.5;ctx.strokeStyle='#C9A400';ctx.stroke();}
function atom(x,y,el,r=15){const f={C:'#6C757D',H:'#FFFFFF',O:C.o2}[el];ball(x,y,r,f,2.2);txt(el,x,y+1,r*1.05,el==='C'?'#fff':C.ink,'center',800);}

/* ---------- plant scene ---------- */
const SX=330,GY=560;
const LEAVES=[{y:485,side:-1,L:125},{y:425,side:1,L:150},{y:365,side:-1,L:140},{y:305,side:1,L:118},{y:255,side:-1,L:88}];
function leafAng(l,d){return l.side>0?-0.45+d:Math.PI+0.45-d;}
function leafC(i,d=0){const l=LEAVES[i],a=leafAng(l,d);return[SX+Math.cos(a)*l.L*.55,l.y+Math.sin(a)*l.L*.55];}
function drawLeaf(a,L,fill){ctx.save();ctx.rotate(a);ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(L*.5,-L*.34,L,0);ctx.quadraticCurveTo(L*.5,L*.34,0,0);fs(fill,2.5);ctx.beginPath();ctx.moveTo(4,0);ctx.lineTo(L*.86,0);ctx.lineWidth=1.8;ctx.strokeStyle='rgba(43,45,66,.4)';ctx.stroke();ctx.restore();}
function drawSky(col){ctx.fillStyle=col||C.sky;ctx.fillRect(0,0,W,GY);}
function drawSun(x,y,t,b=1){ctx.save();ctx.globalAlpha=.25+.75*b;ctx.translate(x,y);ctx.rotate(t*.15);for(let i=0;i<12;i++){ctx.rotate(Math.PI/6);ctx.beginPath();ctx.moveTo(0,-58);ctx.lineTo(7,-74);ctx.lineTo(-7,-74);ctx.closePath();fs('#FFD166',2);}ctx.restore();ctx.save();ctx.globalAlpha=.3+.7*b;ctx.beginPath();ctx.arc(x,y,48,0,7);fs(b>.5?'#FFD166':'#E9D8A6',3);ctx.restore();addHit(x,y,60,'sun');}
const ROOTS=[[SX,GY,SX-60,GY+50,SX-118,GY+118],[SX,GY,SX+55,GY+60,SX+125,GY+105],[SX,GY,SX-6,GY+80,SX-18,GY+142],[SX-38,GY+38,SX-85,GY+66,SX-160,GY+74],[SX+30,GY+40,SX+92,GY+48,SX+165,GY+56]];
function drawGround(moist=1){const soil=['#C9A27A','#A0785A','#7F5B41'][moist];ctx.fillStyle=soil;ctx.fillRect(0,GY,W,H-GY);ctx.fillStyle='#8AB17D';ctx.fillRect(0,GY-6,W,10);ctx.beginPath();ctx.moveTo(0,GY-6);ctx.lineTo(W,GY-6);ctx.lineWidth=2.5;ctx.strokeStyle=C.ink;ctx.stroke();
 for(const r of ROOTS){ctx.beginPath();ctx.moveTo(r[0],r[1]);ctx.quadraticCurveTo(r[2],r[3],r[4],r[5]);ctx.lineWidth=7;ctx.strokeStyle=C.ink;ctx.stroke();ctx.lineWidth=3.5;ctx.strokeStyle='#E9D8A6';ctx.stroke();}
 const n=[1,5,10][moist];for(let i=0;i<n;i++){const x=60+((i*137)%520),y=GY+40+((i*71)%120);drawDrop(x,y,.55);}
 addHit(SX-60,GY+80,55,'root');}
function drawPlant(o={}){const d=o.droop||0,fill=o.fill||C.leaf;
 ctx.beginPath();ctx.moveTo(SX,GY);ctx.quadraticCurveTo(SX-8,400,SX,215);ctx.lineWidth=14;ctx.strokeStyle=C.ink;ctx.stroke();ctx.lineWidth=9;ctx.strokeStyle='#7CB66B';ctx.stroke();
 LEAVES.forEach((l,i)=>{ctx.save();ctx.translate(SX,l.y);drawLeaf(leafAng(l,d),l.L,fill);ctx.restore();const c=leafC(i,d);addHit(c[0],c[1],30,'leaf');});
 ctx.save();ctx.translate(SX,218);drawLeaf(-Math.PI/2,38,fill);ctx.restore();}

/* magnifier: inside a leaf */
const MX=910,MY=345,MR=235;
const CHL=[],PAL=[],SPO=[];
(function(){for(let x=664;x<1160;x+=50){PAL.push(x);[[12,190],[32,216],[12,246],[32,272],[14,300]].forEach(p=>{const cx=x+p[0],cy=p[1];if(Math.hypot(cx-MX,cy-MY)<MR-18)CHL.push([cx,cy]);});}
 let k=0;for(let row=0;row<3;row++)for(let x=684+(row%2)*31;x<1150;x+=62){k++;if(k%4===2)continue;const y=362+row*52;if(Math.hypot(x-760,y-415)<55)continue;SPO.push([x,y,22+(k%3)*2]);}})();
function drawMag(t,showLabels){
 const c=leafC(1);ctx.save();ctx.setLineDash([7,6]);ctx.lineWidth=2;ctx.strokeStyle=C.ink;ctx.beginPath();ctx.moveTo(c[0],c[1]-14);ctx.lineTo(MX-150,MY-181);ctx.moveTo(c[0],c[1]+14);ctx.lineTo(MX-150,MY+181);ctx.stroke();ctx.restore();
 ctx.beginPath();ctx.arc(c[0],c[1],18,0,7);fs(null,3);
 ctx.save();ctx.beginPath();ctx.arc(MX,MY,MR,0,7);ctx.clip();
 ctx.fillStyle=C.sky;ctx.fillRect(MX-MR,MY-MR,MR*2,MR*2);
 ctx.fillStyle='#E9F5DB';ctx.fillRect(MX-MR,122,MR*2,425);
 ctx.fillStyle='#C9E4A8';ctx.fillRect(MX-MR,118,MR*2,8);
 for(let x=650;x<1170;x+=50){rr(x,127,48,34,6);fs('#F7FBF2',2);}
 for(const x of PAL){rr(x,166,44,152,10);fs('#D8EEC5',2);}
 for(const s of SPO){ctx.beginPath();ctx.arc(s[0],s[1],s[2],0,7);fs('#D8EEC5',2);ctx.beginPath();ctx.ellipse(s[0]-6,s[1]-4,6,4,.4,0,7);fs(C.chl,1.5);ctx.beginPath();ctx.ellipse(s[0]+7,s[1]+6,6,4,-.3,0,7);fs(C.chl,1.5);}
 for(const p of CHL){ctx.beginPath();ctx.ellipse(p[0],p[1],9,6,.3,0,7);fs(C.chl,1.8);}
 // vein
 ctx.beginPath();ctx.arc(760,415,38,0,7);fs('#F1E3C3',2.5);for(const p of [[748,402],[764,398],[778,408],[752,416]]){ctx.beginPath();ctx.arc(p[0],p[1],7,0,7);fs(C.water,1.5);}for(const p of [[756,434],[772,430]]){ctx.beginPath();ctx.arc(p[0],p[1],6,0,7);fs('#FFE8A3',1.5);}
 // lower epidermis + stoma
 for(let x=650;x<1170;x+=50){if(x>850&&x<950)continue;rr(x,512,48,30,6);fs('#F7FBF2',2);}
 ctx.beginPath();ctx.ellipse(892,527,17,14,0,0,7);fs(C.chl,2.2);ctx.beginPath();ctx.ellipse(928,527,17,14,0,0,7);fs(C.chl,2.2);
 ctx.beginPath();ctx.ellipse(910,527,4,10,0,0,7);fs('#1B263B',1);
 ctx.fillStyle='#C9E4A8';ctx.fillRect(MX-MR,543,MR*2,4);
 drawParts(true);
 ctx.restore();
 ctx.beginPath();ctx.arc(MX,MY,MR,0,7);fs(null,6);
 pill('🔍 inside a leaf · not to scale',MX,MY-MR-4,{size:13,bg:'#fff'});
 addHit(910,527,26,'stoma');addHit(CHL[6][0],CHL[6][1],16,'chloroplast');addHit(CHL[12][0],CHL[12][1],16,'chloroplast');addHit(760,415,36,'vein');
 if(showLabels){leader('chloroplast',CHL[CHL.length-3][0],CHL[CHL.length-3][1],1215,180,{size:15});leader('stoma',928,535,1180,590,{size:15});leader('vein',740,440,640,560,{size:15});}
}
function legend(items){const x0=640,w=600;rr(x0,650,w,54,27);fs('#fff',2.5);const step=w/items.length;items.forEach((k,i)=>{const cx=x0+step*i+26,cy=677;({co2:()=>drawCO2(cx,cy,.8),water:()=>drawDrop(cx,cy,.8),light:()=>drawPhoton(cx,cy,1),glucose:()=>drawGlu(cx,cy,.9),o2:()=>drawO2(cx,cy,.9)})[k]();txt({co2:'CO₂',water:'H₂O',light:'light',glucose:'glucose',o2:'O₂'}[k],cx+22,cy+1,16,C.ink,'left',700);addHit(cx+20,cy,32,k==='light'?'sun':k);});}

/* ---------- particles ---------- */
let parts=[];
function mkPath(pts){const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return{pts,L,total:L[L.length-1]||1};}
function along(p,f){const d=f*p.total;let i=1;while(i<p.L.length-1&&p.L[i]<d)i++;const s=(d-p.L[i-1])/((p.L[i]-p.L[i-1])||1),a=p.pts[i-1],b=p.pts[i];return[a[0]+(b[0]-a[0])*s,a[1]+(b[1]-a[1])*s];}
function spawn(type,pts,dur,mag=false,s=1){if(parts.length>280)return;parts.push({type,path:mkPath(pts),dur,age:0,mag,s});}
function updParts(dt){for(const p of parts)p.age+=dt;parts=parts.filter(p=>p.age<p.dur);}
function drawParts(mag){for(const p of parts){if(p.mag!==mag)continue;const f=p.age/p.dur,[x,y]=along(p.path,f);ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,f*6,(1-f)*6));
 ({co2:()=>drawCO2(x,y,.75*p.s),water:()=>drawDrop(x,y,.75*p.s),photon:()=>drawPhoton(x,y,.9*p.s),glu:()=>drawGlu(x,y,.8*p.s),o2:()=>drawO2(x,y,.8*p.s)})[p.type]();ctx.restore();}}
let acc={};
function every(k,iv,dt){acc[k]=(acc[k]||0)+dt;if(acc[k]>=iv){acc[k]-=iv;return true;}return false;}

/* ---------- sound & voice ---------- */
let AC=null,soundOn=true,voiceOn=false;
function beep(f,d=.12,type='sine',v=.08){if(!soundOn)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
function chime(ok){if(ok){beep(660,.12);setTimeout(()=>beep(880,.18),110);}else beep(200,.25,'triangle',.07);}
function say(s){if(!voiceOn||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s.replace(/₂/g,' 2').replace(/₆/g,'6').replace(/₁₂/g,'12').replace(/CO 2/g,'C O 2').replace(/H 2O/g,'H 2 O'));u.lang='en-GB';u.rate=.92;speechSynthesis.speak(u);}catch(e){}}

 if(st===0||st===1){const y=330,X=[150,290,420,900,1040,1150];

 }
 if(st===2){formula([{t:'6',hl:'#FFD6D9',c:C.red},{t:'CO₂ + 6H₂O  →  C'},{t:'₆',hl:'#DDF6FD'},{t:'H'},{t:'₁₂',hl:'#DDF6FD'},{t:'O'},{t:'₆',hl:'#DDF6FD'},{t:' + 6O₂'}],640,120,40);
  rr(60,180,540,400,22);fs('#fff',3);txt('BIG number in front',330,215,22,C.red);txt('= number of MOLECULES',330,247,19);
  for(let i=0;i<6;i++){const x=200+(i%3)*130,y=340+((i/3)|0)*90;const k=Math.min(1,Math.max(0,(sceneT-.3-i*.35)*3));if(k){ctx.save();ctx.globalAlpha=k;drawCO2(x,y,1.7);txt(String(i+1),x,y+38,16,C.red);ctx.restore();}}
  txt('6CO₂ = six carbon dioxide molecules',330,545,18,C.ink,'center',600);
  rr(680,180,540,400,22);fs('#fff',3);txt('small numbers below',950,215,22,'#0077B6');txt('= ATOMS inside ONE molecule',950,247,19);
  const rows=[['C',6],['H',12],['O',6]];rows.forEach(([el,n],r)=>{const y=310+r*75;txt(el+' × '+n,740,y,20,C.ink,'left',800);for(let i=0;i<n;i++){const k=Math.min(1,Math.max(0,(sceneT-.5-r*.6-i*.06)*4));if(k){ctx.save();ctx.globalAlpha=k;atom(825+i*30,y,el,el==='H'?11:14);ctx.restore();}}});
  txt('1 glucose = 6 C + 12 H + 6 O = 24 atoms',950,545,18,C.ink,'center',600);}
 if(st===3){const a=BAL.a,b=BAL.b,c=BAL.c;

  ['C','H','O'].forEach((el,i)=>{const y=488+i*38,ok=L[el]===R[el];atom(470,y,el,13);txt(String(L[el]),620,y,22,ok?C.chl:C.red,'center',800);txt(String(R[el]),760,y,22,ok?C.chl:C.red,'center',800);txt(ok?'✓':'✗',845,y,24,ok?C.chl:C.red,'center',800);});
  if(balanced()){pill('🎉 Balanced! 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂',640,72,{size:20,bg:'#C7F0D8'});}
  else caption(SCENES[3].steps[3].cap);
  return;}
 caption(SCENES[3].steps[st].cap);}

function scene5(dt){const lf=F.L/2,r=rateNow();
 drawSky(mix('#7D8FA6',C.sky,lf));drawSun(110,95,T,LVV[F.L]);drawGround(F.W);
 const fill=F.W===0?'#A7C957':C.leaf;drawPlant({droop:[0.55,.18,0][F.W],fill});
 if(F.L>0)rays(5,lf);
 // CO2 in air
 const n=[3,8,15][F.C];for(let i=0;i<n;i++){const x=480+((i*97)%330)+Math.sin(T*.7+i)*14,y=150+((i*61)%330)+Math.cos(T*.6+i*2)*10;drawCO2(x,y,.8);}
 addHit(640,300,70,'co2');
 rateShown+=(r-rateShown)*Math.min(1,dt*3);
 gluMade+=rateShown*dt*1.5;
 if(every('ob',.22/Math.max(rateShown,.05),dt)){const c=leafC((Math.random()*5)|0,[0.55,.18,0][F.W]);spawn('o2',[c,[c[0]+rnd(20,90),c[1]-rnd(150,230)]],2.6);}
 drawParts(false);
 // gauge
 const gx=1010,gy=260,gr=135;rr(gx-190,100,380,250,22);fs('#fff',3);
 [[Math.PI,Math.PI*1.33,'#E63946'],[Math.PI*1.33,Math.PI*1.66,'#FFB703'],[Math.PI*1.66,Math.PI*2,'#2A9D8F']].forEach(([a,b,c])=>{ctx.beginPath();ctx.arc(gx,gy,gr-22,a,b);ctx.lineWidth=26;ctx.strokeStyle=c;ctx.stroke();});
 ctx.beginPath();ctx.arc(gx,gy,gr-8,Math.PI,0);ctx.lineWidth=2.5;ctx.strokeStyle=C.ink;ctx.stroke();ctx.beginPath();ctx.arc(gx,gy,gr-36,Math.PI,0);ctx.stroke();
 const na=Math.PI+Math.PI*rateShown;ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx+Math.cos(na)*(gr-30),gy+Math.sin(na)*(gr-30));ctx.lineWidth=6;ctx.strokeStyle=C.ink;ctx.lineCap='round';ctx.stroke();ctx.lineCap='butt';ball(gx,gy,10,C.ink,0);
 txt('Photosynthesis rate',gx,gy+30,19);txt(r>=.99?'HIGH':r>=.5?'MEDIUM':'LOW',gx,gy+60,22,r>=.99?C.chl:r>=.5?'#B8860B':C.red,'center',800);
 drawGlu(gx-80,384,1.1);txt('glucose made: '+Math.floor(gluMade),gx-58,384,17,C.ink,'left',700);
 drawO2(gx-80,414,1);txt('oxygen bubbles = rate',gx-58,414,15,'#2B2D42aa','left',600);
 if(P===1)caption(facMsg());else caption('Predict!');}

/* ---------- navigation ---------- */
const dotsEl=document.getElementById('dots');
SCENES.forEach((s,i)=>{const b=document.createElement('button');b.className='dot';b.textContent=i+1;b.title=s.title;b.onclick=()=>go(i,0);dotsEl.appendChild(b);});
function go(s,p){S=s;P=p;sceneT=0;parts=[];acc={};pop.classList.remove('show');setOverlays();updateUI();beep(520,.06);const st=SCENES[S].steps[P];say(st.h+'. '+(st.p||''));}
function next(){if(P<SCENES[S].steps.length-1)go(S,P+1);else if(S<SCENES.length-1)go(S+1,0);}
function back(){if(P>0)go(S,P-1);else if(S>0)go(S-1,SCENES[S-1].steps.length-1);}
function setOverlays(){['qcard','bal','fac','quiz'].forEach(id=>document.getElementById(id).classList.remove('show'));
 const st=SCENES[S].steps[P];
 if(st.q===1)showQ(1,'Where does most of the mass of a large tree come from?',['From the soil','From carbon dioxide in the air (and water)','From sunlight'],1,'Most of a tree\'s mass is made from carbon taken from <b>CO₂ in the air</b>, plus water. In the 1600s, van Helmont grew a willow tree that gained about 74 kg, while the soil lost only about 57 g!');
 if(st.q===2)showQ(2,'If plants produce oxygen, where does that oxygen go?',['It stays inside the leaf','It is released into the atmosphere, mainly through the stomata','It goes down to the roots'],1,'Oxygen diffuses out of the leaf through the <b>stomata</b> and into the atmosphere.');
 if(st.q===5){Object.assign(F,{L:2,C:2,W:2});if(answered[5]!==undefined)F.L=0;showQ(5,'A plant has plenty of water and CO₂, but very little sunlight. What happens?',['The rate stays high','The rate of photosynthesis becomes low','The plant makes more oxygen'],1,'Light is the <b>limiting factor</b>: without enough energy, the "food factory" slows down even if CO₂ and water are plentiful.',()=>{F.L=0;});}
 if(S===4&&P===1){document.getElementById('fac').classList.add('show');syncFac();}
 if(S===3&&P===3)document.getElementById('bal').classList.add('show');
 if(S===5)document.getElementById('quiz').classList.add('show');}
function updateUI(){[...dotsEl.children].forEach((d,i)=>{d.classList.toggle('on',i===S);d.classList.toggle('done',i<S);});
 const sc=SCENES[S],st=sc.steps[P];
 document.getElementById('stepc').textContent=`Part ${S+1}/${SCENES.length} · step ${P+1}/${sc.steps.length}`;
 document.getElementById('info').innerHTML=`<div class="ptitle">${sc.part}</div><h2>${st.h}</h2>${st.html||''}<p${st.html?' style="margin-top:6px;font-weight:700"':''}>${st.html?'💡 Remember: “'+st.p+'”':st.p}</p>`+(S<5&&!st.q&&!(S===3&&P===3)?'<div class="hint">Tip: click molecules, leaves, the Sun or the stoma to learn more.</div>':'');
 document.getElementById('bBack').disabled=S===0&&P===0;document.getElementById('bNext').disabled=S===SCENES.length-1;}
document.getElementById('bNext').onclick=next;document.getElementById('bBack').onclick=back;
document.getElementById('bReset').onclick=()=>{for(const k in answered)delete answered[k];Object.assign(BAL,{a:1,b:1,c:1});['a','b','c'].forEach(q=>document.getElementById('n'+q).textContent=1);Object.assign(F,{L:2,C:2,W:2});gluMade=0;for(const k in quizSel)delete quizSel[k];buildQuiz();T=0;go(0,0);};
const bP=document.getElementById('bPause');bP.onclick=()=>{paused=!paused;bP.textContent=paused?'▶ Play':'⏸ Pause';};
document.getElementById('speed').onchange=e=>speed=+e.target.value;
const bV=document.getElementById('bVoice');bV.onclick=()=>{voiceOn=!voiceOn;bV.textContent=voiceOn?'🔊 Narration on':'🔇 Narration off';if(voiceOn){const st=SCENES[S].steps[P];say(st.h+'. '+st.p);}else try{speechSynthesis.cancel();}catch(e){}};
const bS=document.getElementById('bSound');bS.onclick=()=>{soundOn=!soundOn;bS.textContent=soundOn?'🔈 Sound on':'🔇 Sound off';};
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&(e.key===' '))return;if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')back();});

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const raw=Math.min(.05,(now-last)/1000);last=now;const dt=paused?0:raw*speed;T+=dt;sceneT+=dt;updParts(dt);
 ctx.clearRect(0,0,W,H);hits=[];
 [scene1,d=>plantMagScene(d,'R'),d=>plantMagScene(d,'P'),scene4,scene5,scene6,scene7][S](dt);
 requestAnimationFrame(frame);}
go(0,0);requestAnimationFrame(frame);
