<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inside a Leaf – 3D Simulation</title>
<style>
:root{
  --bg:#eef1e6; --surface:#ffffff; --ink:#1d2a17; --muted:#5d6b55; --line:#d5dccb;
  --accent:#3f8f1f; --accent-ink:#ffffff; --chip:#ffffffe6; --shadow:0 6px 24px rgba(30,45,20,.16);
  --good:#2f8a3a; --bad:#c0392b;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#141912; --surface:#1e251b; --ink:#e7eedf; --muted:#a3b19a; --line:#334030;
    --accent:#7cc94e; --accent-ink:#10200a; --chip:#1e251be6; --shadow:0 6px 24px rgba(0,0,0,.45);
    --good:#6fd17a; --bad:#ff7a6b; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:1fr 370px;height:100vh;height:100dvh}
#view{position:relative;overflow:hidden;min-height:0}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#chip{position:absolute;left:14px;top:14px;background:var(--chip);backdrop-filter:blur(6px);
  padding:8px 14px;border-radius:999px;box-shadow:var(--shadow);font-weight:650;font-size:14px;
  display:flex;gap:8px;align-items:center;max-width:calc(100% - 28px)}
#chip .n{background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:24px;height:24px;
  display:grid;place-items:center;font-size:13px}
#labels{position:absolute;inset:0;pointer-events:none}
#labels svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lbl{position:absolute;transform:translate(-50%,-50%);background:var(--chip);color:var(--ink);
  border:1.5px solid var(--accent);border-radius:8px;padding:3px 9px;font-size:13px;font-weight:600;
  white-space:nowrap;box-shadow:var(--shadow);pointer-events:auto;cursor:pointer;transition:opacity .3s}
#card{position:absolute;left:14px;top:62px;width:min(320px,calc(100% - 28px));background:var(--surface);
  border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;display:none;border-left:5px solid var(--accent)}
#card h3{margin:0 0 6px;font-size:17px}
#card p{margin:0 0 8px}
#card .hint{color:var(--muted);font-size:13px;margin:0}
#card .x{position:absolute;right:8px;top:6px;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer}
#bar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:6px;
  align-items:center;justify-content:center;background:var(--chip);backdrop-filter:blur(6px);
  padding:8px 10px;border-radius:16px;box-shadow:var(--shadow);width:max-content;max-width:calc(100% - 20px)}
button{font:inherit;color:inherit}
.b{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 11px;cursor:pointer;
  font-size:14px;font-weight:600;min-height:34px}
.b:hover{border-color:var(--accent)}
.b.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.b.play{min-width:44px}
#dots{display:flex;gap:5px;align-items:center;padding:0 4px}
#dots i{width:22px;height:8px;border-radius:5px;background:var(--line);cursor:pointer;position:relative;overflow:hidden}
#dots i b{position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:0}
#panel{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:18px 18px 28px;min-height:0}
#panel h1{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
#panel h2{font-size:21px;margin:0 0 10px;line-height:1.25}
#narr{font-size:15.5px;margin:0 0 12px}
#note{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.box h4{margin:0 0 8px;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
input[type=range]{width:100%;accent-color:var(--accent)}
.meter{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.meter b{display:block;height:100%;background:linear-gradient(90deg,#9ccc65,#3f8f1f);width:0;transition:width .2s}
.row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.q{margin:10px 0 14px}
.q p{margin:0 0 6px;font-weight:600}
.q button{display:block;width:100%;text-align:left;margin:4px 0;border:1px solid var(--line);background:var(--bg);
  border-radius:9px;padding:7px 10px;cursor:pointer}
.q button.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,transparent)}
.q button.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.q .fb{font-size:13px;color:var(--muted);margin-top:4px}
#score{font-weight:700;font-size:16px}
ul.sum{padding-left:18px;margin:6px 0}
ul.sum li{margin:3px 0}
@media (max-width:900px){
  html,body{overflow:auto}
  #app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto}
  #view{height:62vh}
  #panel{border-left:0;border-top:1px solid var(--line)}
  #bar{bottom:8px;gap:4px;padding:6px}
  .b{padding:5px 8px;font-size:13px;min-height:32px}
  #dots i{width:14px}
  .lbl{font-size:11.5px;padding:2px 6px}
  #chip{font-size:13px}
  #card{top:54px;padding:10px 12px;font-size:13px}
  #card h3{font-size:15px}
  #card .hint{display:none}
}
</style>
<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

}}
</script>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="labels"><svg id="lines"></svg></div>
    <div id="chip"><span class="n" id="chipN">1</span><span id="chipT"></span></div>
    <div id="card"><button class="x" id="cardX" aria-label="Close">×</button><h3 id="cardH"></h3><p id="cardP"></p><p class="hint" id="cardHint"></p></div>
    <div id="bar">
      <button class="b" id="prev" title="Previous">◀</button>
      <button class="b play on" id="play" title="Play / Pause">❚❚</button>
      <button class="b" id="next" title="Next">▶</button>
      <div id="dots"></div>
      <button class="b" id="speed">1×</button>
      <button class="b on" id="voice" title="Narration">🔊</button>
      <button class="b on" id="lab" data-i="labels">Labels</button>
      <button class="b" id="free" data-i="free">Free camera</button>
      <button class="b" id="reset" title="Reset view">⟲</button>
      <button class="b" id="lang">SQ</button>
    </div>
  </div>
  <aside id="panel">
    <h1 id="kicker"></h1>
    <h2 id="title"></h2>
    <p id="narr"></p>
    <p id="note"></p>
    <div id="extra"></div>
    <p id="tapHint" style="font-size:13px;color:var(--muted)"></p>
  </aside>
</div>

const pv = new THREE.Vector3();
function updateFlows(time, dt){
  for (const f of Object.values(flows)){
    f.alpha += (f.target - f.alpha) * Math.min(1, dt*3);
    let rate = 1;
    if (['co2','o2','h2o'].includes(f.name)) rate = stomaOpen < 0.15 ? 0 : stomaOpen;
    if (f.name === 'light' && f.useL) rate = lightLevel;
    f.mesh.visible = f.alpha > 0.01;
    if (!f.mesh.visible) continue;
    f.mesh.material.opacity = 0.95 * f.alpha;
    const sp = f.name === 'o2' ? Math.max(0.1, lightLevel) : 1;
    for (let i=0;i<f.n;i++){
      let u = ((time*sp/f.period) + i/f.n) % 1;
      let s = f.size * Math.min(1, u/0.08, (1-u)/0.08);
      if (i/f.n >= rate) s = 0;
      f.curves[i].getPointAt(u, pv); dummy.position.copy(pv); dummy.rotation.set(0,0,0); dummy.scale.setScalar(Math.max(s, 1e-4)); dummy.updateMatrix(); f.mesh.setMatrixAt(i, dummy.matrix);
    }
    f.mesh.instanceMatrix.needsUpdate = true;
  }
}

  try { speechSynthesis.cancel(); } catch(e){ return; }
  if (!voiceOn || stageIdx < 0) return;
  const v = findVoice(lang); if (!v) return;
  const u = new SpeechSynthesisUtterance(STAGES[stageIdx][lang][1]); u.voice = v; u.lang = v.lang; u.rate = 0.95 * (speed < 1 ? 0.85 : 1);
  speechSynthesis.speak(u);
}
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => text();

function select(k, keep){
  selected = k; const p = PARTS[k][lang], L = T[lang];
  $('cardH').textContent = p[0]; $('cardP').textContent = p[1]; $('cardHint').textContent = L.pageHint + p[2]; $('card').style.display = 'block';
}
$('cardX').onclick = () => { selected = null; $('card').style.display = 'none'; };

function go(i){ t = starts[Math.max(0, Math.min(STAGES.length-1, i))] + 0.001; camBlend = 0; }
$('prev').onclick = () => go((t - starts[stageIdx] < 1.5 ? stageIdx - 1 : stageIdx));
$('next').onclick = () => go(stageIdx + 1);
$('play').onclick = () => { playing = !playing; if (playing && t >= TOTAL - 0.05) go(0); $('play').textContent = playing ? '❚❚' : '▶'; $('play').classList.toggle('on', playing); if (!playing) try{speechSynthesis.pause()}catch(e){} else try{speechSynthesis.resume()}catch(e){} };
$('speed').onclick = () => { speed = speed === 1 ? 0.5 : 1; $('speed').textContent = speed + '×'; };
$('voice').onclick = () => { voiceOn = !voiceOn; $('voice').classList.toggle('on', voiceOn); $('voice').textContent = voiceOn ? '🔊' : '🔈'; if (!voiceOn) try{speechSynthesis.cancel()}catch(e){} else speak(); text(); };
$('lab').onclick = () => { labelsOn = !labelsOn; $('lab').classList.toggle('on', labelsOn); };
$('free').onclick = () => { freeCam = !freeCam; $('free').classList.toggle('on', freeCam); controls.enabled = freeCam; if (freeCam) controls.target.copy(camTgt); };
$('reset').onclick = () => { freeCam = false; controls.enabled = false; $('free').classList.remove('on'); camBlend = 0; };
$('lang').onclick = () => { lang = lang === 'en' ? 'sq' : 'en'; document.documentElement.lang = lang; text(); speak(); };

/* picking */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let downAt = null;
function pickAt(e){ const r = renderer.domElement.getBoundingClientRect(); mouse.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse, camera); const hits = ray.intersectObjects(pickables, false).filter(h => { const m = Array.isArray(h.object.material)?h.object.material[0]:h.object.material; return h.object.userData.part==='airSpace' || (m.visible && m.opacity > 0.2); });
  return hits.length ? hits[0].object.userData.part : null; }
renderer.domElement.addEventListener('pointerdown', e => downAt = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => { if (!downAt || Math.hypot(e.clientX-downAt[0], e.clientY-downAt[1]) > 6) return; const p = pickAt(e); if (p) select(p); });
let hoverT = 0; renderer.domElement.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; const now = performance.now(); if (now - hoverT < 80) return; hoverT = now; renderer.domElement.style.cursor = pickAt(e) ? 'pointer' : (freeCam ? 'grab' : 'default'); });

/* ---------------- camera ---------------- */
const camPos = new THREE.Vector3(1.2,-8.5,15.5), camTgt = new THREE.Vector3(-0.2,0.4,1.0); let camBlend = 1;
const kp = new THREE.Vector3(), kt = new THREE.Vector3();

/* ---------------- main update ---------------- */
const ease = x => 1 - Math.pow(1 - Math.min(1,Math.max(0,x)), 3);
const curOp = {cut:1,epi:1,pal:1,spo:1,sheath:1,vasc:1,guard:1};
function update(dt){
  // stage
  let si = 0; for (let i=0;i<STAGES.length;i++) if (t >= starts[i]) si = i;
  if (si !== stageIdx){ stageIdx = si; text(); speak(); }
  const s = STAGES[si], lt = t - starts[si];
  // rise
  const rise = ease(t / 3.2);
  riser.scale.set(0.92 + 0.08*rise, 0.92 + 0.08*rise, Math.max(0.002, rise));
  riser.position.set(-0.2*(1-rise)*0.08, 0, 0);
  glow.material.opacity = t < 4.5 ? Math.sin(Math.min(1, t/4.5) * Math.PI) * 0.85 : 0;
  // opacity per tissue
  for (const g of Object.keys(curOp)){ const tg = s.op[g] ?? 1; curOp[g] += (tg - curOp[g]) * Math.min(1, dt*3); }
  const vis = Math.min(1, t/1.2);
  for (const m of matGroups.cut) setOp(m, curOp.cut*vis);
  for (const m of matGroups.epi) setOp(m, curOp.epi*vis);
  for (const m of matGroups.pal) setOp(m, curOp.pal*vis);
  for (const m of matGroups.spo) setOp(m, curOp.spo*vis);
  for (const m of matGroups.sheath) setOp(m, curOp.sheath*vis);
  for (const m of [...matGroups.vasc, ...matGroups.guard, ...matGroups.chlP, ...matGroups.chlS]) setOp(m, vis);
  partMats.airSpace[0].opacity = (si === 3 || si === 4) ? 0.16 + 0.06*Math.sin(clock*2) : 0.0;
  // chloroplast glow follows light
  const lightNow = (s.flows.light === 'L') ? lightLevel : (s.flows.light ? s.flows.light : 0);
  for (const m of [...matGroups.chlP]) m.emissiveIntensity = 0.05 + lightNow * 0.55 * (0.8 + 0.2*Math.sin(clock*4));
  for (const m of [...matGroups.chlS]) m.emissiveIntensity = 0.03 + lightNow * 0.25;
  if ($('rateM')) $('rateM').style.width = Math.round(100 * (1 - Math.exp(-lightLevel*2.2)) / (1 - Math.exp(-2.2))) + '%';
  // guard cells
  let o = stomaOpen; if (si < 3) o = 0.85; buildGuards(o);
  guardMat.color.setHSL(0.19, 0.5, 0.38 + 0.06*o);
  // flows
  for (const [k,f] of Object.entries(flows)){ const v = s.flows[k]; f.useL = v === 'L'; f.target = v ? (typeof v === 'number' ? v : 1) : 0; if (k==='light' && typeof v === 'number') f.target = 1; }
  if (si === 0) for (const f of Object.values(flows)) f.target = 0;
  updateFlows(clock, dt);
  // highlight selected
  for (const [k,ms] of Object.entries(partMats)) for (const m of ms){ if (k==='airSpace' || !m.emissive) continue;
    if (k === selected){ m.emissive.setHex(0xfff27a); m.emissiveIntensity = 0.25 + 0.2*Math.sin(clock*6); }
    else if (!matGroups.chlP.includes(m) && !matGroups.chlS.includes(m)) { m.emissive.copy(m.userData.baseEm); m.emissiveIntensity = m.userData.baseEI; }
    else { m.emissive.setHex(0x8cff3a); } }
  if (selected === 'airSpace') partMats.airSpace[0].opacity = 0.35 + 0.15*Math.sin(clock*6);
  // camera
  kp.fromArray(s.cam[0]); kt.fromArray(s.cam[1]);
  if (innerWidth < 600) { kp.sub(kt).multiplyScalar(1.35).add(kt); }
  if (!freeCam){ const k = 1 - Math.exp(-dt * 2.2); camPos.lerp(kp, k); camTgt.lerp(kt, k); camera.position.copy(camPos); camera.lookAt(camTgt); }
  else { controls.update(); camTgt.copy(controls.target); camPos.copy(camera.position); }
  // stage dots
  [...dots.children].forEach((d,i) => { d.firstChild.style.width = (i < si ? 100 : i > si ? 0 : 100*Math.min(1, lt / STAGES[i].dur)) + '%'; });
}
const lv = new THREE.Vector3();
function drawLabels(){
  const s = STAGES[stageIdx], r = view.getBoundingClientRect(), small = innerWidth < 600;
  for (const [k, L] of Object.entries(labelEls)){
    const want = labelsOn && t > 3 && (s.labels.includes(k) || selected === k);
    L.op += ((want?1:0) - L.op) * 0.15;
    const a = PARTS[k].a; lv.set(a[0], a[1], a[2] === 'D' ? D : a[2]);
    leaf.localToWorld(lv); lv.project(camera);
    const x = (lv.x*0.5+0.5)*r.width, y = (-lv.y*0.5+0.5)*r.height;
    let [dx,dy] = PARTS[k].o; if (small) { dx *= 0.6; dy *= 0.6; }
    const lx = Math.min(r.width-50, Math.max(50, x+dx)), ly = Math.min(r.height-70, Math.max(20, y+dy));
    const show = L.op > 0.02 && lv.z < 1;
    L.el.style.opacity = show ? L.op : 0; L.el.style.left = lx+'px'; L.el.style.top = ly+'px'; L.el.style.pointerEvents = show && L.op > 0.5 ? 'auto' : 'none';
    L.ln.setAttribute('x1',x); L.ln.setAttribute('y1',y); L.ln.setAttribute('x2',lx); L.ln.setAttribute('y2',ly); L.ln.style.opacity = show ? L.op : 0;
    L.dot.setAttribute('cx',x); L.dot.setAttribute('cy',y); L.dot.style.opacity = show ? L.op : 0;
  }
}
function resize(){ const r = view.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

let last = performance.now(), clock = 0;
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now; clock += dt * speed;
  if (playing){ t += dt * speed; if (t >= TOTAL) { t = TOTAL - 0.001; playing = false; $('play').textContent='▶'; $('play').classList.remove('on'); } }
  // stay on the quiz stage; pause automatically at the end of interactive stages? no — keep flowing.
  update(dt); renderer.render(scene, camera); drawLabels();
  requestAnimationFrame(frame);
}
window.__sim = { go:(i)=>go(i), setT:(x)=>{t=x;}, select, snap:()=>{ camPos.copy(kp); camTgt.copy(kt); }, pause:()=>{ if (playing) $('play').click(); } };
requestAnimationFrame(frame);
</script>
</body>
